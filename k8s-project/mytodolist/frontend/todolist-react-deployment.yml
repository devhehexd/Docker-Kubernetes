apiVersion: apps/v1
kind: Deployment
metadata:
  name: todolist-react
spec:
  replicas: 1
  selector:
    matchLabels:
      app: react
  template:
    metadata:
      labels:
        app: react
    spec:
      containers:
      - name: nginx
        image: devhehexd/todolistfront:v8
        ports:
        - containerPort: 80  # Nginx가 사용하는 포트
