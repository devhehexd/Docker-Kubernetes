# mysql-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: todolist-mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
      - name: mysql
        image: devhehexd/mytodolist:todolist-mysql
        env:
        - name: MYSQL_ROOT_PASSWORD
          value: "rlqja"   # MySQL root 비밀번호
        - name: MYSQL_DATABASE
          value: "todolist"  # WordPress 데이터베이스 이름
        - name: MYSQL_USER
          value: "rlqja"  # WordPress 데이터베이스 사용자 이름
        - name: MYSQL_PASSWORD
          value: "rlqja"  # WordPress 데이터베이스 사용자 비밀번호
        ports:
        - containerPort: 3307
        volumeMounts:
        - name: todolist-db
          mountPath: /var/lib/mysql
      volumes:
      - name: todolist-db
        persistentVolumeClaim:
          claimName: todolist-mysql-pvc